services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hexstrike
      POSTGRES_USER: hexstrike
      POSTGRES_PASSWORD: hexstrike_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hexstrike"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NOTE: hexstrike MCP server runs standalone on host:8888
  # The backend reaches it via host.docker.internal:8888

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql+asyncpg://hexstrike:hexstrike_pass@postgres:5432/hexstrike
      HEXSTRIKE_URL: http://host.docker.internal:8888
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASS: ${ADMIN_PASS:-hexstrike}
      SECRET_KEY: ${SECRET_KEY:-hexstrike-secret-change-in-prod}
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      JIRA_PROJECT_KEY: ${JIRA_PROJECT_KEY:-}
      JIRA_CLIENT_NAME: ${JIRA_CLIENT_NAME:-}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
